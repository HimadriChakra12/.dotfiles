# -----------------------------
# i3blocks Gruvbox Theme
# -----------------------------
separator=false
markup=pango
color=#ebdbb2

[separator]
label=  

[cpu_usage]
label= 
command=~/.config/i3/scripts/i3blocks/cpu_usage
interval=2

[separator]
label=  

[memory]
label=
command=~/.config/i3/scripts/i3blocks/memory
interval=2

[separator]
label=  

[battery]
label=
command=upower -i "$(upower -e | grep BAT)" | awk '/state:/ {s=$2} /percentage:/ {p=$2} END {if (s=="charging") print "C " p; else if (s=="fully-charged") print "F " p; else print "B " p}'
interval=1

[separator]
label=  

[volume]
label=V 
command=pactl get-sink-mute @DEFAULT_SINK@ | grep -q yes && echo MUTE || echo "$(pactl get-sink-volume @DEFAULT_SINK@ | grep -oP '\d+%' | head -1)"
interval=1
signal=1

[separator]
label=  

[time]
label=o 
command=date '+%H%M%S'
interval=1
